version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aperture_postgres
    restart: always
    environment:
      POSTGRES_USER: aperture
      POSTGRES_PASSWORD: aperture_secure_password_2026
      POSTGRES_DB: aperture_aiot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aperture -d aperture_aiot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aperture_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aperture_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://aperture:aperture_secure_password_2026@postgres:5432/aperture_aiot
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=aperture_enterprise_production_secret_key_change_me_in_prod_987654321
      - CORS_ORIGINS=*
      - HARDWARE_EXECUTION_LOCAL_ONLY=true
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/backend/storage
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: aperture_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
  backend_storage:
